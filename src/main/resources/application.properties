spring.application.name=kafka-eventhub-test

# Kafka
spring.kafka.bootstrap-servers=${EVENT_HUB_NAMESPACE_ENDPOINT}:9093
spring.kafka.consumer.group-id=${EVENT_HUB_CONSUMER_GROUP:$Default}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Azure Entra ID
spring.cloud.azure.credential.client-id=${AZURE_CLIENT_ID}
spring.cloud.azure.credential.client-secret=${AZURE_CLIENT_SECRET}
spring.cloud.azure.profile.tenant-id=${AZURE_TENANT_ID}

# Topic
app.eventhub.topic=${EVENT_HUB_TOPIC_NAME}

# Run mode: producer, consumer, or both (default: both)
app.mode=${APP_MODE:both}

# Logging - verbose only for producer/consumer
logging.level.root=WARN
logging.level.com.example=INFO
logging.level.org.springframework.kafka=INFO
